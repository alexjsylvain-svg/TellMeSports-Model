<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="TellMe Sports: every prop, simulated possession by possession">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12233b"/><stop offset="1" stop-color="#070f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".35" r=".55">
      <stop offset="0" stop-color="#1fae6f" stop-opacity=".28"/><stop offset="1" stop-color="#1fae6f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1fae6f"/><stop offset="1" stop-color="#5ee6a6"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>
  <!-- faint court arc -->
  <path d="M1500 40a420 420 0 0 0 0 420" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="3"/>
  <circle cx="1500" cy="250" r="120" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="3"/>

  <!-- mark -->
  <g transform="translate(110 110) scale(.546875)">
    <path d="M136 112h240a56 56 0 0 1 56 56v148a56 56 0 0 1-56 56H236l-72 58v-58h-28a56 56 0 0 1-56-56V168a56 56 0 0 1 56-56z" fill="#f4f7fb"/>
    <rect x="140" y="256" width="60" height="78" rx="12" fill="#c9d3df"/>
    <rect x="226" y="200" width="60" height="134" rx="12" fill="#c9d3df"/>
    <rect x="312" y="146" width="60" height="188" rx="12" fill="url(#bar)"/>
    <line x1="124" y1="222" x2="388" y2="222" stroke="#12233b" stroke-width="7" stroke-dasharray="16 12" stroke-linecap="round"/>
    <circle cx="342" cy="112" r="26" fill="#ff7a45"/>
    <path d="M316 112h52M342 86v52M323 93c12 9 12 29 0 38M361 93c-12 9-12 29 0 38" stroke="#12233b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="420" y="262" font-family="'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="132" letter-spacing="-3" fill="#f4f7fb">Tell<tspan fill="#5ee6a6">Me</tspan></text>
  <text x="426" y="322" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace" font-size="34" letter-spacing="14" fill="#9fb0c4">SPORTS DASHBOARD</text>
  <text x="426" y="388" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" fill="#c9d3df">Every prop, simulated possession by possession.</text>

  <!-- hit-rate strip, the product's signature -->
  <g transform="translate(1110 150)">
    <line x1="-10" y1="118" x2="310" y2="118" stroke="#f4f7fb" stroke-opacity=".55" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="0"   y="70"  width="34" height="130" rx="6" fill="url(#bar)"/>
    <rect x="46"  y="170" width="34" height="30"  rx="6" fill="#ff6b6b"/>
    <rect x="92"  y="90"  width="34" height="110" rx="6" fill="url(#bar)"/>
    <rect x="138" y="140" width="34" height="60"  rx="6" fill="#ff6b6b"/>
    <rect x="184" y="100" width="34" height="100" rx="6" fill="url(#bar)"/>
    <rect x="230" y="50"  width="34" height="150" rx="6" fill="url(#bar)"/>
    <rect x="276" y="80"  width="34" height="120" rx="6" fill="url(#bar)"/>
    <text x="310" y="236" text-anchor="end" font-family="'IBM Plex Mono',Consolas,monospace" font-size="22" fill="#9fb0c4">5 of 7 over the line</text>
  </g>
</svg>
