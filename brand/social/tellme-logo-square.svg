<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="TellMe Sports">
  <!-- Square profile logo (Whop, Discord server icon, X avatar). Everything sits inside the center circle, so round crops keep it whole. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12233b"/><stop offset="1" stop-color="#070f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#1fae6f" stop-opacity=".22"/><stop offset="1" stop-color="#1fae6f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1fae6f"/><stop offset="1" stop-color="#5ee6a6"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g transform="translate(231 128) scale(1.05)">
    <path d="M136 112h240a56 56 0 0 1 56 56v148a56 56 0 0 1-56 56H236l-72 58v-58h-28a56 56 0 0 1-56-56V168a56 56 0 0 1 56-56z" fill="#f4f7fb"/>
    <rect x="140" y="256" width="60" height="78" rx="12" fill="#c9d3df"/>
    <rect x="226" y="200" width="60" height="134" rx="12" fill="#c9d3df"/>
    <rect x="312" y="146" width="60" height="188" rx="12" fill="url(#bar)"/>
    <line x1="124" y1="222" x2="388" y2="222" stroke="#12233b" stroke-width="7" stroke-dasharray="16 12" stroke-linecap="round"/>
    <circle cx="342" cy="112" r="26" fill="#ff7a45"/>
    <path d="M316 112h52M342 86v52M323 93c12 9 12 29 0 38M361 93c-12 9-12 29 0 38" stroke="#12233b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <text x="500" y="728" text-anchor="middle" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-weight="900" font-size="150" letter-spacing="-3" fill="#f4f7fb">Tell<tspan fill="#5ee6a6">Me</tspan></text>
  <text x="511" y="808" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="500" font-size="46" letter-spacing="22" fill="#9fb0c4">SPORTS</text>
</svg>
