<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="TellMe Sports">
  <!-- 16:9 full logo for posts and announcements: the mark and wordmark side by side, with lots of room around them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12233b"/><stop offset="1" stop-color="#070f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#1fae6f" stop-opacity=".2"/><stop offset="1" stop-color="#1fae6f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1fae6f"/><stop offset="1" stop-color="#5ee6a6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <path d="M1600 180a360 360 0 0 0 0 540" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="3"/>
  <path d="M0 180a360 360 0 0 1 0 540" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="3"/>
  <g transform="translate(300 222) scale(.82)">
    <path d="M136 112h240a56 56 0 0 1 56 56v148a56 56 0 0 1-56 56H236l-72 58v-58h-28a56 56 0 0 1-56-56V168a56 56 0 0 1 56-56z" fill="#f4f7fb"/>
    <rect x="140" y="256" width="60" height="78" rx="12" fill="#c9d3df"/>
    <rect x="226" y="200" width="60" height="134" rx="12" fill="#c9d3df"/>
    <rect x="312" y="146" width="60" height="188" rx="12" fill="url(#bar)"/>
    <line x1="124" y1="222" x2="388" y2="222" stroke="#12233b" stroke-width="7" stroke-dasharray="16 12" stroke-linecap="round"/>
    <circle cx="342" cy="112" r="26" fill="#ff7a45"/>
    <path d="M316 112h52M342 86v52M323 93c12 9 12 29 0 38M361 93c-12 9-12 29 0 38" stroke="#12233b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <text x="700" y="480" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-weight="900" font-size="190" letter-spacing="-4" fill="#f4f7fb">Tell<tspan fill="#5ee6a6">Me</tspan></text>
  <text x="708" y="560" font-family="'IBM Plex Mono',Consolas,monospace" font-weight="500" font-size="52" letter-spacing="26" fill="#9fb0c4">SPORTS</text>
  <text x="708" y="630" font-family="'Helvetica Neue',Arial,sans-serif" font-size="34" fill="#c9d3df">NBA player props, simulated 50,000 times a night.</text>
</svg>
