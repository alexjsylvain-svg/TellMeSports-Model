<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TellMe Sports">
<!-- home-screen app: manifest and icons live next to index.html on Pages (docs/manifest.webmanifest, docs/icons/; sources in brand/icons) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)">
<title>TellMe Sports</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout: slate sheet. Tonight's two picks per game first, then the game grid, then one game opened in detail. */
:root{
  --paper:#eef1f4; --sheet:#ffffff; --ink:#15202b; --mute:#5b6876; --rule:#d5dbe2; --rule-strong:#aab4bf;
  --accent:#1f44c9; --accent-soft:#e3e9fb;
  --over:#0f7a4a; --over-soft:#dcf1e6; --under:#b3261e; --under-soft:#f8e1df; --warn:#9a6400; --warn-soft:#f6ebd3;
  --away:#1d5bb8; --home:#6a3fb5;
  --court:#e8d6b4; --paint:#dcc49a; --court-line:#8a6a3c; --ball:#e0702a;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e141b; --sheet:#151d26; --ink:#e6ebf0; --mute:#93a1af; --rule:#26313d; --rule-strong:#3a4757;
  --accent:#7d9bff; --accent-soft:#1c2747;
  --over:#4fd08f; --over-soft:#123325; --under:#ff8a80; --under-soft:#3a1a18; --warn:#e8b55a; --warn-soft:#352a14;
  --away:#6ea3ff; --home:#b596ff; --court:#2a241c; --paint:#352c20; --court-line:#8c7656; --ball:#f08a3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e141b; --sheet:#151d26; --ink:#e6ebf0; --mute:#93a1af; --rule:#26313d; --rule-strong:#3a4757;
  --accent:#7d9bff; --accent-soft:#1c2747;
  --over:#4fd08f; --over-soft:#123325; --under:#ff8a80; --under-soft:#3a1a18; --warn:#e8b55a; --warn-soft:#352a14;
  --away:#6ea3ff; --home:#b596ff; --court:#2a241c; --paint:#352c20; --court-line:#8c7656; --ball:#f08a3c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.5rem;font-weight:800;line-height:1}
h2{font-size:1.45rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:1.08rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
td,th,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
p{margin:0;max-width:78ch}
.muted{color:var(--mute)}
section.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:18px;display:grid;gap:14px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.field{display:grid;gap:3px}
.field label,.flabel{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
input,select,button{font:inherit;color:var(--ink)}
input[type=number],select{background:var(--sheet);border:1px solid var(--rule-strong);border-radius:4px;padding:5px 7px;min-width:0}
input[type=number]{width:5.4em;font-family:var(--f-mono);font-size:.9rem}
input.sm{width:4.2em;padding:3px 5px;font-size:.82rem}
button{cursor:pointer;border-radius:4px;border:1px solid var(--rule-strong);background:var(--sheet);padding:6px 12px;font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-family:var(--f-display);font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 18px}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,.gcard:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;width:200px;max-width:100%}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.status-line{font-family:var(--f-mono);font-size:.78rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;border:1px solid var(--rule-strong);background:var(--sheet);font-weight:500}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* slate grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.gcard{border:1px solid var(--rule);border-radius:6px;padding:12px;display:grid;gap:8px;cursor:pointer;background:var(--sheet);text-align:left}
.gcard:hover{border-color:var(--rule-strong)}
.gcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gc-teams{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.1}
.gc-row{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;font-size:.8rem;align-items:baseline}
.gc-row b{font-family:var(--f-mono);font-weight:500}
.wbar{display:flex;height:8px;border-radius:2px;overflow:hidden}
.wbar i{display:block;height:100%}
.gc-best{font-size:.78rem;color:var(--mute);min-height:1.2em}
.gc-best b{color:var(--over)}

/* game detail */
.det-head{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:flex-end;justify-content:space-between}
.bigscore{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1}
.scoreline{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.winbar{display:flex;height:28px;border-radius:4px;overflow:hidden;font-family:var(--f-display);font-weight:700;color:var(--sheet)}
.winbar div{display:flex;align-items:center;padding:0 10px;white-space:nowrap;min-width:0;overflow:hidden}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-family:var(--f-mono);font-size:10px}
.verdict{background:var(--accent-soft);border-radius:4px;padding:10px 12px;font-size:.92rem}
.note{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:8px 12px;font-size:.84rem}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--rule-strong)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font-family:var(--f-display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;color:var(--mute)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;max-height:640px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{font-family:var(--f-mono);font-weight:500;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:right;padding:7px 8px;border-bottom:1px solid var(--rule-strong);background:var(--paper);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
tr.team-row td{background:var(--paper);font-family:var(--f-display);font-weight:700;font-size:.95rem;letter-spacing:.05em;text-transform:uppercase;text-align:left}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--accent-soft)}
.pname{font-weight:600}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.75rem;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:1px;letter-spacing:.04em}
.tag.q{background:var(--warn-soft);color:var(--warn)} .tag.out{background:var(--under-soft);color:var(--under)} .tag.st{background:var(--accent-soft);color:var(--accent)} .tag.pr{background:var(--paper);color:var(--mute);border:1px solid var(--rule)}
.chip{display:inline-block;min-width:3.6em;text-align:center;font-family:var(--f-mono);font-size:.78rem;padding:2px 5px;border-radius:3px}
.chip.o{background:var(--over-soft);color:var(--over)} .chip.u{background:var(--under-soft);color:var(--under)} .chip.n{background:var(--paper);color:var(--mute)}
.up{color:var(--over)} .dn{color:var(--under)}
.ev{font-family:var(--f-mono);font-weight:500}

/* replay */
.replay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (max-width:860px){.replay{grid-template-columns:minmax(0,1fr)}}
.scorebug{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--ink);color:var(--sheet);border-radius:6px;padding:12px 16px}
.scorebug .t{font-family:var(--f-display);font-size:1.2rem;font-weight:700;text-transform:uppercase}
.scorebug .s{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1}
.scorebug .c{font-family:var(--f-mono);font-size:.8rem;text-align:center;opacity:.8}
.pbp{position:relative;max-height:460px;overflow-y:auto;border:1px solid var(--rule);border-radius:4px}
.pbp div{display:grid;grid-template-columns:4.6em 3.2em minmax(0,1fr) 5em;gap:8px;padding:5px 10px;border-bottom:1px solid var(--rule);font-size:.82rem;align-items:baseline}
.pbp div.score{font-weight:600}
.pbp .clk{font-family:var(--f-mono);color:var(--mute);font-size:.75rem}
.pbp .tm{font-family:var(--f-display);font-weight:700}
.pbp .sc{font-family:var(--f-mono);text-align:right}
.pbp .txt{min-width:0;white-space:normal}
.qtable td,.qtable th{text-align:center}
.courtwrap{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--rule-strong);background:var(--court)}
.courtwrap canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.caption{position:absolute;left:0;right:0;bottom:0;padding:6px 12px;background:color-mix(in srgb,var(--sheet) 82%,transparent);font-size:.86rem;font-weight:500}
.pbp div.now{background:var(--accent-soft)}
.pbp div{cursor:pointer}
.method{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.method div{display:grid;gap:4px;align-content:start}
.method b{font-family:var(--f-display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em}
.foot{font-size:.8rem;color:var(--mute);display:grid;gap:6px}
.foot a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}

/* Phone view: tonight's frozen card, live tracking, every priced prop and the season record, read from the published files */
body.phone .wrap{display:none}
#phoneApp[hidden]{display:none}
#phoneApp{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));font-size:15px}
.pa-top{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 10px;display:grid;gap:10px;border-bottom:1px solid var(--rule)}
.pa-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pa-title{font-family:var(--f-display);font-size:1.75rem;font-weight:800;line-height:1}
.tm-brand{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:800;font-size:.95rem;letter-spacing:.01em;color:var(--ink)}
.tm-brand b{color:var(--over);font-weight:800}
.tm-mark{width:26px;height:26px;flex:none;display:block}
.tm-banner{display:block;width:100%;max-width:760px;height:auto;border-radius:14px}
.tm-banner-ph{margin-top:10px;border-radius:12px}
.pa-stamp{font-family:var(--f-mono);font-size:.75rem;color:var(--mute);text-align:right;line-height:1.35}
.pa-tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--rule);border-radius:9px;padding:2px;gap:2px}
.pa-tabs button{border:0;border-radius:7px;background:none;padding:7px 0;font-family:var(--f-display);font-size:1rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);min-height:44px}
.pa-tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pa-tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--under);margin-left:5px;vertical-align:2px}
.pa-sport{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pa-sport button{border:1px solid var(--rule);border-radius:9px;background:var(--sheet);padding:8px 0;font-family:var(--f-display);font-size:1.05rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.pa-sport button[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pa-sport .pa-pilot{font-family:var(--f-mono);font-size:.75rem;font-weight:500;letter-spacing:.05em;border:1px solid currentColor;border-radius:999px;padding:0 6px;opacity:.8}
.pa-tabs.nfl{grid-template-columns:repeat(6,1fr)}
.pa-tabs.nfl button{font-size:.8rem;letter-spacing:0}
.nf-game summary,.pa-game>summary{list-style:none;cursor:pointer;display:grid;gap:6px}
.pa-game>summary::-webkit-details-marker{display:none}
.pa-game>summary .nf-more{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.pa-game[open]>summary .nf-more{display:none}
.nf-game summary::-webkit-details-marker{display:none}
.nf-game summary .nf-more{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.nf-game[open] summary .nf-more{display:none}
.nf-wp{display:flex;height:22px;border-radius:6px;overflow:hidden;font-family:var(--f-mono);font-size:.75rem;font-weight:600}
.nf-wp i{font-style:normal;display:flex;align-items:center;padding:0 7px;white-space:nowrap;min-width:0}
.nf-wp i:first-child{background:var(--rule);color:var(--ink)}
.nf-wp i:last-child{background:var(--ink);color:var(--sheet);justify-content:flex-end}
.nf-scr{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px;display:grid;gap:3px}
.nf-share{display:inline-block;height:6px;border-radius:3px;background:var(--over);vertical-align:1px;margin-right:6px}
.nf-kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px}
.nf-kp div{display:grid;gap:1px}
.nf-cmp{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,58px);column-gap:4px}
.nf-cmp>div{padding:7px 0;border-bottom:1px solid var(--rule);min-width:0}
.nf-cmp>div:nth-last-child(-n+4){border-bottom:0}
.nf-cmp .h{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:right;padding-top:0}
.nf-cmp .l{font-size:.86rem;line-height:1.25}
.nf-cmp small{display:block;font-size:.75rem;color:var(--mute);font-weight:400;font-family:var(--f-mono);letter-spacing:0;text-transform:none}
.nf-cmp .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:.92rem;color:var(--mute)}
.nf-cmp .cur{color:var(--ink)}
.nf-cmp .v small{white-space:nowrap;font-size:.75rem;letter-spacing:-.02em}
.nf-cmp .v.cur{background:var(--warn-soft);border-radius:6px;padding-right:6px}
.nf-mg{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--rule)}.nf-mg:first-child{border-top:0}
.nf-mg i{font-style:normal;font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin-left:12px}.nf-mg small{font-family:var(--f-mono);font-size:.75rem;color:var(--mute);margin-left:2px}
.nf-wk{display:grid;grid-template-columns:34px 1fr 1fr 78px;gap:6px;padding:6px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums;font-size:.88rem}
.nf-wk span:not(:first-child){text-align:right}
.nf-wk.h{border-top:0;padding-top:0;font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.nf-team{display:grid;grid-template-columns:40px minmax(0,1fr) 92px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--rule)}
.nf-team b{font-family:var(--f-display);font-size:1.05rem}
.nf-tm{font-size:.78rem;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
.nf-div{position:relative;height:18px;background:linear-gradient(var(--rule),var(--rule)) center/1px 100% no-repeat}
.nf-div i{position:absolute;top:4px;height:10px;border-radius:2px;opacity:.85}
.nf-div em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--f-mono);font-size:.75rem;font-weight:600;text-shadow:0 0 3px var(--sheet),0 0 3px var(--sheet)}.nf-kp b{font-family:var(--f-display);font-size:1.15rem}.nf-kp span{font-size:.75rem;color:var(--mute)}
.pa-tabs[hidden]{display:none}
.nf-pilotbar{display:grid;gap:3px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:.82rem;line-height:1.35;margin-bottom:10px}
.nf-pilotbar b{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.nf-pilotbar span{color:var(--ink)}
.nf-chips{display:flex;flex-wrap:wrap;gap:6px}
.nf-gsel{margin:0 0 10px}
.nf-chips button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--mute);cursor:pointer}
.nf-chips button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.nf-tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.nf-tbl th,.nf-tbl td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top;white-space:normal;overflow-wrap:anywhere}
.nf-tbl th{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:500}
.nf-tbl td.n,.nf-tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nf-kept{color:var(--over);font-weight:600}
.nf-bars{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end;height:70px}
.nf-bars i{display:block;border-radius:3px 3px 0 0;min-height:2px}
.nf-bl{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;font-family:var(--f-mono);font-size:.75rem;color:var(--mute);text-align:center}
.pa-sec{display:grid;gap:12px;padding-top:14px;min-width:0}
.pa-card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
.pa-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pa-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pa-kpis div{display:grid;gap:1px;min-width:0}
.pa-kpis b,.pa-nums b{font-family:var(--f-display);font-size:1.55rem;font-weight:700;line-height:1.05}
.pa-kpis span,.pa-nums span{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}

      ${(g.all.qb||[]).map(q=>`<tr><td>${esc(q.player)} <span class="pa-small">QB</span></td><td class="n" colspan="2">${q.cmp}/${q.att}, ${q.pyds} yds</td><td class="n"></td></tr>`).join("")}
      ${(g.all.players||[]).map(p=>`<tr><td>${esc(p.player)} <span class="pa-small">${esc(p.pos)}</span></td><td class="n">${p.rec||p.recyds?`${p.rec}–${p.recyds}`:""}</td><td class="n">${p.car?`${p.car}–${p.ryds}`:""}</td><td class="n">${p.td.toFixed(2)}</td></tr>`).join("")}</table></div>`:""}`; }
// ---- Trends: how spreads and totals have played out (nfl/trends.json) ----
const nfRec=r=>r?`${r.w}-${r.l}${r.p?`-${r.p}`:""}`:"";
const nfPc=r=>r&&(r.w+r.l)?Math.round(r.w/(r.w+r.l)*100):null;
// one comparison row: label, then each season's value (a record shows its % big and the record small)
function nfCmpRow(L,label,f,{rec=false,sub=""}={}){ return `<div class="l">${label}${sub?`<small>${sub}</small>`:""}</div>${L.map((s,i)=>{ const x=f(s);
    const cls=i===L.length-1?"v cur":"v"; if(!rec) return `<div class="${cls}">${x??"–"}</div>`;
    const p=nfPc(x); return `<div class="${cls}">${p==null?"–":p+"%"}<small>${nfRec(x)}</small></div>`; }).join("")}`; }
function nfCmp(L,title,rows){ return `<div class="pa-h" role="heading" aria-level="2">${title}</div><div class="pa-card"><div class="nf-cmp"><div class="l h"></div>${L.map((s,i)=>`<div class="h${i===L.length-1?" cur":""}">${s.season}${i===L.length-1?`<small>wk 1–${s.weeks}</small>`:""}</div>`).join("")}${rows.join("")}</div></div>`; }
function nfTrends(){ const t=NF.trends; if(!t) return empty("No trends yet","");
  const L=t.league||[], cur=L[L.length-1]||{}, sgn=x=>`${x>0?"+":x<0?"−":""}${Math.abs(x).toFixed(1)}`;
  const key=NF.tsort||"cover", sorts={cover:["Vs spread",x=>x.cover],ats:["ATS",x=>{ const [w,l]=String(x.ats).split("-").map(Number); return w/Math.max(1,w+l); }],ou:["Overs",x=>{ const [w,l]=String(x.ou).split("-").map(Number); return w/Math.max(1,w+l); }],ppg:["Points",x=>x.ppg]};
  const teams=(t.teams||[]).slice().sort((a,b)=>sorts[key][1](b)-sorts[key][1](a)), mx=Math.max(1,...teams.map(x=>Math.abs(x.cover)));
  const wk=t.weeks||[];
  return `<div class="pa-card"><div class="pa-small" style="margin-bottom:8px">${esc(cur.season)} through week ${cur.weeks}, ${cur.games} games with a final score.</div>
    <div class="nf-kp"><div><b>${nfRec(cur.overs)}</b><span>overs-unders</span></div><div><b>${cur.points}</b><span>avg points (line ${cur.totalLine})</span></div><div><b>${nfRec(cur.favATS)}</b><span>favorites ATS</span></div>
      <div><b class="${nfPc(cur.homeATS)<46?"dn":""}">${nfRec(cur.homeATS)}</b><span>home teams ATS</span></div><div><b>${sgn(cur.homeMargin)}</b><span>home margin (spread ${sgn(cur.homeSpread)})</span></div><div><b class="${nfPc(cur.fav7)<46?"dn":""}">${nfRec(cur.fav7)}</b><span>7+ pt favorites ATS</span></div></div></div>
    ${nfCmp(L,"Totals",[nfCmpRow(L,"Avg total line",s=>s.totalLine),nfCmpRow(L,"Avg points",s=>s.points),nfCmpRow(L,"Overs",s=>s.overs,{rec:true}),
      nfCmpRow(L,"Low totals",s=>s.low41,{rec:true,sub:"line ≤ 41"}),nfCmpRow(L,"High totals",s=>s.high47,{rec:true,sub:"line ≥ 47"}),
      nfCmpRow(L,"Dome overs",s=>s.dome,{rec:true}),nfCmpRow(L,"Outdoor overs",s=>s.outdoors,{rec:true})])}
    ${nfCmp(L,"Spreads",[nfCmpRow(L,"Favorites ATS",s=>s.favATS,{rec:true}),nfCmpRow(L,"7+ pt favs ATS",s=>s.fav7,{rec:true}),
      nfCmpRow(L,"Home ATS",s=>s.homeATS,{rec:true}),nfCmpRow(L,"Home wins",s=>s.homeSU,{rec:true}),
      nfCmpRow(L,"Home margin",s=>`${sgn(s.homeMargin)}<small>line ${sgn(s.homeSpread)}</small>`,{}),
      nfCmpRow(L,"Miss vs spread",s=>`±${s.sdMargin}`),nfCmpRow(L,"Miss vs total",s=>`±${s.sdTotal}`)])}
    <div class="pa-h" role="heading" aria-level="2">Most common final margins</div><div class="pa-card">${L.map(s=>`<div class="nf-mg"><span class="pa-small">${s.season}</span><span>${(s.margins||[]).slice(0,4).map(x=>`<i>${x.m}<small>${Math.round(x.share*100)}%</small></i>`).join("")}</span></div>`).join("")}</div>
    ${wk.length?`<div class="pa-h" role="heading" aria-level="2">${cur.season} week by week</div><div class="pa-card"><div class="nf-wk h"><span>Wk</span><span>Overs</span><span>Fav ATS</span><span>Pts vs line</span></div>
      ${wk.map(w=>{ const d=w.points-w.line; return `<div class="nf-wk"><span>${w.week}</span><span>${nfRec(w.overs)}</span><span>${nfRec(w.favATS)}</span><span class="${d>0?"up":"dn"}">${sgn(d)}</span></div>`; }).join("")}</div>`:""}
    ${teams.length?`<div class="pa-h" role="heading" aria-level="2">Teams, ${cur.season}</div><div class="pa-card"><div class="nf-chips" style="margin-bottom:8px">${Object.entries(sorts).map(([k,[n]])=>`<button data-ts="${k}" aria-pressed="${k===key}">${n}</button>`).join("")}</div>
      ${teams.map(x=>{ const w=Math.abs(x.cover)/mx*50; return `<div class="nf-team"><b>${esc(x.team)}</b><span class="nf-tm">${esc(x.su)} · ATS ${esc(x.ats)}<br><span class="muted">O/U ${esc(x.ou)} · ${x.ppg}–${x.papg}</span></span>
        <span class="nf-div"><i style="${x.cover>=0?`left:50%;width:${w}%;background:var(--over)`:`right:50%;width:${w}%;background:var(--under)`}"></i><em class="${x.cover>0?"up":"dn"}">${sgn(x.cover)}</em></span></div>`; }).join("")}
      <div class="pa-small" style="margin-top:8px">Second line: over-under record, then points scored–allowed a game. The bar is how many points a game the team has beaten (green) or missed (red) the spread by.</div></div>`:""}
    ${(t.notes||[]).length?`<div class="pa-h" role="heading" aria-level="2">What it means for the model</div><div class="pa-card">${t.notes.map(n=>`<p class="pa-note" style="margin:0 0 8px">${esc(n)}</p>`).join("")}</div>`:""}`; }
function nfBacktest(){ const b=NF.bt; if(!b) return empty("No backtest yet","");
  const roi=x=>`${(x*100).toFixed(1)}%`, wk=b.weekly26||[], mx=Math.max(1,...wk.map(w=>Math.abs(w.staked)));
  return `<div class="pa-card"><div class="pa-small">${esc(b.note)}</div>
    <table class="nf-tbl"><tr><th>Set</th><th class="n">Record</th><th class="n">Staked</th><th class="n">Return</th></tr>${b.rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${r.w}-${r.l}</td><td class="n ${r.staked>0?"up":"dn"}">${U(r.staked)}</td><td class="n">${roi(r.roi)}</td></tr>`).join("")}</table></div>
    ${wk.length?`<div class="pa-h" role="heading" aria-level="2">2026 week by week (held out)</div><div class="pa-card"><div class="nf-bars">${wk.map(w=>`<i title="week ${w.week}: ${w.w}-${w.l}, ${U(w.staked)}" style="height:${Math.max(3,Math.abs(w.staked)/mx*68)}px;background:${w.staked>=0?"var(--over)":"var(--under)"}"></i>`).join("")}</div><div class="nf-bl">${wk.map(w=>`<span>W${w.week}<br>${SGN(w.staked)}</span>`).join("")}</div></div>`:""}
    ${b.factors?`<div class="pa-h" role="heading" aria-level="2">Matchup factors</div><div class="pa-card"><div class="pa-small">Each factor tried alone on top of season stats, defense vs position and game script. Lower log loss is better (opening line alone: pass yds .6931, rec yds .6937, receptions .6811).</div>
      <table class="nf-tbl"><tr><th>Factor</th><th class="n">Pass yds</th><th class="n">Rec yds</th><th class="n">Card</th></tr>${b.factors.map(f=>`<tr><td class="${f.kept?"nf-kept":""}">${esc(f.name)}</td><td class="n">${f.passYds.toFixed(4)}</td><td class="n">${f.recYds.toFixed(4)}</td><td class="n">${f.w}-${f.l} ${U(f.staked,1)}</td></tr>`).join("")}</table>
      <div class="pa-small">No free data says which corner covers which receiver, so "primary defender" is approximated by what each defense allows to an offense's top target. It didn't help.</div></div>`:""}
    ${b.priceBands?`<div class="pa-h" role="heading" aria-level="2">Plus money past +150 (5%+ edge, flat 1u, openers)</div><div class="pa-card"><table class="nf-tbl"><tr><th>Price</th><th class="n">2025</th><th class="n">2026</th></tr>${b.priceBands.map(x=>`<tr><td>${esc(x.band)}<br><span class="pa-small">${esc(x.note)}</span></td><td class="n">${esc(x.s25)}</td><td class="n">${esc(x.s26)}</td></tr>`).join("")}</table>
      <div class="pa-small">Only +151 to +250 held up in both seasons, so the card goes that far and no further for now. The bar moves out when more weeks back it.</div></div>`:""}
    ${b.parlays?`<div class="pa-h" role="heading" aria-level="2">Parlays (the week's likeliest picks, one per game, 1u)</div><div class="pa-card"><table class="nf-tbl"><tr><th>Set</th><th class="n">Legs</th><th class="n">Record</th><th class="n">Units</th></tr>${b.parlays.map(x=>`<tr><td>${esc(x.set)}</td><td class="n">${x.legs}</td><td class="n">${x.w}-${x.l}</td><td class="n ${x.u>0?"up":"dn"}">${U(x.u)}</td></tr>`).join("")}</table></div>`:""}
    ${b.buckets?`<div class="pa-h" role="heading" aria-level="2">How sure, and how often right (2026 openers, flat 1u)</div><div class="pa-card"><table class="nf-tbl"><tr><th>Win chance</th><th class="n">Record</th><th class="n">Units</th><th class="n">Return</th></tr>${b.buckets.map(x=>`<tr><td>${esc(x.band)}</td><td class="n">${x.w}-${x.l}</td><td class="n ${x.u>0?"up":"dn"}">${U(x.u)}</td><td class="n">${roi(x.roi)}</td></tr>`).join("")}</table>
      <div class="pa-small">Every prop with a 5%+ edge, bet 1u. The card starts at 60%.</div></div>`:""}
    ${b.thresholds?`<div class="pa-h" role="heading" aria-level="2">Where to set the bar</div><div class="pa-card"><table class="nf-tbl"><tr><th>Bar</th><th class="n">Record</th><th class="n">Flat 1u</th><th class="n">Tiered</th></tr>${b.thresholds.map(x=>{ const on=x.minP===.6&&x.minEv===.05; return `<tr><td class="${on?"nf-kept":""}">${Math.round(x.minP*100)}%+, ${Math.round(x.minEv*100)}%+ edge${on?" (card)":""}</td><td class="n">${x.w}-${x.l}</td><td class="n">${U(x.u)} <span class="pa-small">${roi(x.roi)}</span></td><td class="n">${U(x.tiered)} <span class="pa-small">${roi(x.tieredRoi)}</span></td></tr>`; }).join("")}</table>
      <div class="pa-small">Tiered = the NBA stakes (0.5u at 60–64%, 1.5u at 64–66%, 2u at 66%+). With the game sims in, tiered stakes beat flat at the card's bar. An 8% edge bar did better still, but on fewer picks; the card keeps the NBA bar until live results say otherwise.</div></div>`:""}
    ${b.markets?`<div class="pa-h" role="heading" aria-level="2">By market (2026, held out)</div><div class="pa-card"><table class="nf-tbl"><tr><th>Market</th><th class="n">Opener</th><th class="n">+ model</th><th class="n">+ sims</th></tr>${b.markets.map(m=>`<tr><td>${esc(NFL_LABEL[m.st]||m.st)} <span class="pa-small">${m.n}${m.card?"":", not carded"}</span></td><td class="n">${m.llM.toFixed(4)}</td><td class="n ${m.llModel<m.llM?"up":"dn"}">${m.llModel.toFixed(4)}</td><td class="n ${m.sim?(m.llB<m.llModel?"up":"dn"):""}">${m.sim?m.llB.toFixed(4):"—"}</td></tr>`).join("")}</table>
      <div class="pa-small">Log loss, lower is better. The game sims are blended in only where they beat the model alone (rush attempts, rush yards, anytime TD); for passing and receiving they tied or did worse, so those stay on the model.</div></div>`:""}
    ${b.sim?`<div class="pa-h" role="heading" aria-level="2">Game sim settings (fit on 2024–25)</div><div class="pa-card"><div class="pa-small">Margin misses ±${b.sim.sdM}, total misses ±${b.sim.sdT}, touchdown scale ${b.sim.tdK}. Team plays, pass share, yards per attempt, completion rate and yards per carry each move with the defense faced and with the game script (points and margin) by slopes fit on 2025 team games.</div></div>`:""}`; }
function renderNFL(){
  for(const b of app.querySelectorAll("[data-nt]")) b.setAttribute("aria-selected",String(b.dataset.nt===NTAB));
  const c=NF.card, N=NF.loaded&&c?nfNow():null; document.getElementById("paDate").textContent=N?.day?ET(N.games[0].start,{weekday:"long",month:"short",day:"numeric"}):c?`NFL week ${c.week}`:"NFL"; document.getElementById("paStamp").innerHTML=N?`${N.picks.length} paper pick${N.picks.length===1?"":"s"}<br>pilot · week ${c.week}`:"";
  if(!NF.loaded){ loadNFL(); body.innerHTML=`<div class="pa-card pa-empty"><span class="muted">Loading…</span></div>`; return; }
  body.innerHTML=`<div class="nf-pilotbar"><b>NFL pilot · paper only</b><span>This model is new and still being tested. Its picks are tracked on paper and are not recommended bets. The paper record is small; the backtest is history, not a promise.</span></div>`+({week:nfWeek,live:nfLive,props:nfProps,record:nfRecord}[NTAB]||nfWeek)();
}
function render(){
  for(const b of app.querySelectorAll("[data-sport]")) b.setAttribute("aria-selected",String(b.dataset.sport===SPORT));
  document.getElementById("nbaTabs").hidden=SPORT!=="nba"; document.getElementById("nflTabs").hidden=SPORT!=="nfl";
  if(SPORT==="nfl"){ renderNFL(); return; }
  for(const b of app.querySelectorAll("[data-pt]")){ b.setAttribute("aria-selected",String(b.dataset.pt===TAB)); }
  const inPlay=(D.live?.games||[]).some(g=>g.state==="in"); const lb=app.querySelector('[data-pt="live"]'); lb.innerHTML="Live"+(inPlay?`<span class="dot" aria-label="games in progress"></span>`:"");
  const date=tonight(); document.getElementById("paDate").textContent=date?ET(ymd(date),{weekday:"long",month:"short",day:"numeric"}):"Tonight";
  const mine=TRK.bets.filter(t=>t.date===date).length;
  document.getElementById("paStamp").innerHTML=D.picks?`${picks().length} plays${mine?` · ${mine} placed`:""}<br>${D.picks.final?"locked":"not locked"}`:"";
  // the Props search box is never rebuilt while it has focus (that would drop the iPhone keyboard)
  if(TAB==="tonight"&&document.activeElement?.id==="paUnit") return;   // live refreshes wait while the unit box is being typed in
  if(TAB==="props"&&document.activeElement?.id==="paQ"&&document.getElementById("paPL")){ document.getElementById("paPL").innerHTML=propsList(); return; }
  body.innerHTML=({tonight:rTonight,live:rLive,props:rProps,record:rRecord})[TAB]();
}
app.addEventListener("click",e=>{
  const sp=e.target.closest("[data-sport]"); if(sp){ SPORT=sp.dataset.sport; try{ localStorage.setItem("pa-sport",SPORT); }catch(x){} render(); window.scrollTo(0,0); return; }
  const nt=e.target.closest("[data-nt]"); if(nt){ NTAB=nt.dataset.nt; render(); window.scrollTo(0,0); return; }
  const nm=e.target.closest("[data-nm]"); if(nm){ NF.mkt=nm.dataset.nm; render(); return; }
  const ts=e.target.closest("[data-ts]"); if(ts){ NF.tsort=ts.dataset.ts; render(); return; }
  const t=e.target.closest("[data-pt]"); if(t){ TAB=t.dataset.pt; try{ localStorage.setItem("pa-tab",TAB); }catch(x){} render(); window.scrollTo(0,0); if(TAB==="live") refreshLive(); return; }
  const c=e.target.closest("[data-calc]"); if(c){ const [pl,st,side,line,odds]=c.dataset.calc.split("|"); openCalc(pl,st,{side:side||undefined, line:line?+line:undefined, odds:odds?+odds:undefined}); return; }
  const s=e.target.closest("[data-ps]"); if(s){ PF.stat=s.dataset.ps; PF.n=60; render(); return; }
  const tf=e.target.closest("[data-tf]"); if(tf){ const [st,sd]=tf.dataset.tf.split("|"); Object.assign(TF,{stat:st,side:sd,price:"",from:"",to:""}); render(); document.querySelector(".pa-tf")?.scrollIntoView({block:"start"}); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  if(a.dataset.act==="more"){ PF.n+=60; document.getElementById("paPL").innerHTML=propsList(); }
  else if(a.dataset.act==="nfmore"){ NF.n+=60; document.getElementById("nfPL").innerHTML=nfPropsList(); }
  else if(a.dataset.act==="nights"){ REC_ALL=!REC_ALL; render(); }
  else if(a.dataset.act==="askrun"){ REQ.confirm=true; render(); }
  else if(a.dataset.act==="askrun-no"){ REQ.confirm=false; render(); }
  else if(a.dataset.act==="askrun-yes"){ askRun(); }
  else if(a.dataset.act==="copytopic"){ const tp=a.dataset.topic, done=()=>{ a.textContent="Copied ✓"; setTimeout(()=>{ a.textContent="Copy topic"; },2500); };
    (navigator.clipboard?.writeText(tp)||Promise.reject()).then(done).catch(()=>{ const r=document.createRange(), el=app.querySelector(".pa-topic"); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); try{ document.execCommand("copy"); done(); }catch(e){ a.textContent="Press and hold the topic to copy"; } }); }
  else if(a.dataset.act==="pkx"){ const c=a.closest("[data-pk]"), k=c.dataset.pk, on=!PKX.has(k); on?PKX.add(k):PKX.delete(k); c.classList.toggle("open",on); a.setAttribute("aria-expanded",on); }
  else if(a.dataset.act==="jump"){ const c=[...app.querySelectorAll("[data-pk]")].find(x=>x.dataset.pk===a.dataset.key); if(c){ const top=c.getBoundingClientRect().top+scrollY-(app.querySelector(".pa-top")?.offsetHeight||0)-8; window.scrollTo({top,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"}); } }
  else if(a.dataset.act==="help"){ HLP=!HLP; render(); }
  else if(a.dataset.act==="share"){ const b=(D.picks?.bets||[]).find(x=>x.gid+"|"+x.bet===a.dataset.key); if(b) sharePick(b).catch(()=>toast("Couldn't make the picture on this phone.")); }
  else if(a.dataset.act==="tfclear"){ Object.assign(TF,{stat:"",side:"",price:"",from:"",to:"",range:""}); render(); }
  else if(a.dataset.act==="full"){ if(D.picks) FROZEN=D.picks; document.body.classList.remove("phone"); app.hidden=true; window.scrollTo(0,0); if(typeof runAll==="function"&&SLATE&&!Object.keys(PRICED).length) runAll(); }
});
app.addEventListener("input",e=>{ if(e.target.id==="paUnit"){ const v=+e.target.value; if(v>0){ UNIT=v; try{ localStorage.setItem("tellme-unit",String(v)); }catch(x){} app.querySelectorAll("[data-u]").forEach(s=>{ s.textContent=usdTxt(+s.dataset.u); }); } return; }
  if(e.target.id==="paQ"){ PF.q=e.target.value; PF.n=60; document.getElementById("paPL").innerHTML=propsList(); }
  if(e.target.id==="nfQ"){ NF.q=e.target.value; NF.n=60; document.getElementById("nfPL").innerHTML=nfPropsList(); } });
app.addEventListener("change",e=>{ const TFK={tfS:"stat",tfD:"side",tfP:"price",tfF:"from",tfT:"to",tfR:"range"}[e.target.id]; if(TFK){ TF[TFK]=e.target.value; if(TFK==="range"){ const ns=[...new Set((D.season?.bets||[]).map(b=>b.date))].sort(), v=TF.range; if(v!=="custom"){ TF.to=""; TF.from=v==="7"?ns.at(-7)||"":v==="14"?ns.at(-14)||"":v==="month"?ns.find(n=>n.slice(0,6)===ns.at(-1).slice(0,6))||"":""; } } render(); document.getElementById(e.target.id)?.focus({preventScroll:true}); return; }
  if(e.target.id==="nfG"){ NF.game=e.target.value; NF.n=60; render(); document.getElementById("nfG")?.focus({preventScroll:true}); return; }
  if(e.target.id==="nfAll"){ NF.all=e.target.value==="1"; NF.n=60; render(); return; }
  if(e.target.id==="paG"){ PF.game=e.target.value; PF.n=60; render(); } else if(e.target.id==="paAll"){ PF.all=e.target.value==="1"; PF.ban=e.target.value!=="b"; PF.n=60; render(); } });
// the slate night: the card's date, else today in ET (before 5 AM it is still last night's slate)
const slateDay=()=>tonight()||new Date(Date.now()-5*36e5).toLocaleDateString("en-CA",{timeZone:"America/New_York"}).replace(/-/g,"");
// ESPN first on every refresh; when it fails (blocked inside claude.ai, or a network hiccup) the published live.json stands in
// for that refresh only, so one failed request never leaves the page on the published file for the rest of the night
async function getLive(){ try{ return await espnLive(slateDay()); }catch(e){ return get("live"); } }
// keeps the live data current: every 20 s while games are on, else every 2 min; re-renders the two tabs that show it
async function refreshLive(){ const l=await getLive(); if(l) D.live=l; if(TAB==="tonight"||TAB==="live") render(); }
let LIVE_T=0; setInterval(()=>{ const on=(D.live?.games||[]).some(g=>g.state==="in"); if(document.visibilityState==="visible"&&(on||++LIVE_T%6===0)) refreshLive(); },20000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refreshLive(); });
// board.json since Nov 11 keeps each player's game log once (logs) and per-row numbers (lv); older files carry row.log as before
const unpackBoard=b=>{ if(b?.logs) for(const r of b.rows||[]){ const L=b.logs[r.player]; if(!r.log&&L) r.log=L.map((e,i)=>({...e, v:r.lv?.[i]??null})); } return b; };
// the card first (it's small), so Tonight shows at once; the rest follow
const pP=get("picks"); pP.then(p=>{ if(p&&!D.picks){ D.picks=p; render(); } });
Promise.all([pP,...["board","live","season","boxes"].map(get)]).then(([p,b,l,s,x])=>{ Object.assign(D,{picks:p,board:unpackBoard(b),live:l,season:s,boxes:x}); render(); refreshLive(); });
fetch("alerts.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(a=>{ ALERTS=a; }).catch(()=>{});
window.__PA={D,TRK,S,priceAt,verdict,liveChance,grade,openCalc};
})();
