<header><h1>TellMe Sports · NFL pilot</h1><p>Paper picks only while the model is tested. Fanatics player props: passing, rushing and receiving.</p></header>
<main id="app"><div class="card">Loading…</div></main>
<script>
// ===================== model (shared by the page, the backtest and the weekly card) =====================
const NFL = (()=>{
const STATS={PASS_YDS:'pyds',PASS_CMP:'cmp',PASS_ATT:'att',RUSH_YDS:'ryds',RUSH_ATT:'car',REC_YDS:'recyds',REC:'rec'};
const COUNT={PASS_CMP:1,PASS_ATT:1,RUSH_ATT:1,REC:1};
STATS.RR_YDS='rr'; STATS.ATD='td'; STATS.PASS_TD='ptd'; COUNT.PASS_TD=1;   // passing TDs: Nov 12, 2026
const GROUP={PASS_YDS:'pass',PASS_CMP:'pass',PASS_ATT:'pass',PASS_TD:'pass',RUSH_YDS:'rush',RUSH_ATT:'rush',REC_YDS:'rec',REC:'rec',RR_YDS:'rec',ATD:'td'};
const LABEL={PASS_YDS:'pass yds',PASS_CMP:'completions',PASS_ATT:'pass att',PASS_TD:'pass TDs',RUSH_YDS:'rush yds',RUSH_ATT:'rush att',REC_YDS:'rec yds',REC:'receptions',RR_YDS:'rush+rec yds',ATD:'anytime TD'};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[.']/g,'').replace(/[\-,]/g,' ').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();
const impl=o=>o>0?100/(o+100):-o/(-o+100), dec=o=>o>0?1+o/100:1+100/-o;
const lg=x=>{x=Math.min(.99,Math.max(.01,x));return Math.log(x/(1-x));}, sg=x=>1/(1+Math.exp(-x));
// Settings from the Nov 9 backtests (fit on 2025, tested on 2026 weeks 1-8). History: games weighted by a 12-game half-life,

// the OPENING line, fitted on 2025 openers: against the opener the blend beat the market out of sample on receptions
// (.6811 -> .6773), receiving yards (.6937 -> .6919), passing yards and rushing; against Fanatics' near-close price it lost.
// Pass attempts and completions got worse out of sample (.6926 -> .7018), so they're priced but never carded (NOCARD).
// Nov 9 matchup backtest (each factor alone, fit 2025, held out 2026 wk 1-8, blend log loss vs the opener):
//   man/zone + coverage shell: kept. Pass yds .6917 -> .6858, rec yds .6919 -> .6914; card 57-39 +5.06u -> 52-32 +5.25u.
//   blitz rate: dropped (pass yds slightly better, receptions worse, card +2.49u). Box count: no effect (rushing leans on the
//   market, w .05). Top-target "primary defender" proxy: dropped (worse everywhere, card +2.68u).
//   Shrinkage: splits at 30 team dropbacks per look, defense mix at 50 plays (120/150 left every multiplier within ±1%).
// Anytime TD: expected TDs from carries/targets by field position only (tdMix 1: .4746 vs the opener's .4765; mixing in the
// actual TD rate was worse). Margin on Yes-only TD prices 19.6% (2025 openers). No TD price cleared 5% edge in either season.

  w:{PASS_YDS:.4,PASS_CMP:.3,PASS_ATT:.35,PASS_TD:.3,RUSH_YDS:.05,RUSH_ATT:.1,REC_YDS:.25,REC:.3,RR_YDS:.35,ATD:.15},
  fx:{blitz:false,mz:true,cov:true,box:false,top:false,press:false}, windF:.10, windAt:14, windPassOnly:true, kP:30, kD:50, tdMix:1, atdHold:.196,
  // game-sim blend (Nov 9, fit on 2025 openers, held out 2026 wk 1-9): win chance = market, box-score model and 10,000-game sim
  // mixed in log-odds at [model, sim] weights. Rushing and anytime TD only: the sim beat the model there (rush att .6750 -> .6730,
  // rush yds .6694 -> .6684, TD .4937 -> .4932; card at openers 59-36 +9.6u -> 87-55 +18.3u staked); receiving and passing didn't.
  simW:{RUSH_ATT:[0,.25], RUSH_YDS:[0,.15], ATD:[.05,.10]}};
// Nov 12 tests (fit 2025, held out 2026 wk 1-9; paper pilot):
//   pressure (dropbacks with a sack, hit or scramble as a matchup look, fx.press): dropped. Pass yds .6879 -> .6892, receptions
//   .6792 -> .6798, card +16.69u -> +11.26u.
//   Passing TDs (Action Network passing_tds): blend .6858 vs the opener's .6787, card 1-4 -2.3u, so priced but never carded.
//   Sim: QB goal-line TD factor (S0.qbTd) 1.6 fixes QB anytime-TD calibration (sim 11% vs 15% actual -> 15%; QB log loss .455 ->
//   .447 and .408 -> .401) but takes those TDs from RBs/WRs/TEs, so all-TD log loss is flat (.4750 -> .4751, .4746 -> .4743):
//   left at 1. Role-spike shrink (S0.k0, target/carry shares pulled toward 3%) .3 -> 1.5: worse on every stat, left at .3.
//   The official injury report beats a stale ESPN tag for this week's card (curFn: Out/Doubtful there drops a player, a player
//   on the report without either is kept even if ESPN still says Out).
// Nov 13 factor audit (fit 2025, held out 2026 wk 1-9; blend log loss on REC/REC_YDS/PASS_YDS/RUSH_ATT/RUSH_YDS overs at the
// opener, base .68120; card units staked at OPEN 2026/2025 and FAN 2026/2025, base +17.84/+10.66/+2.92/-2.15):
//   opponent factor (gamma .5): kept. Off .68145, +12.72/+8.89/-3.53/+1.06; full strength (1) .68182, +10.95/+7.62/-0.76/-1.81.
//   man/zone + coverage shell: kept. Off .68150, +12.22/+15.49/+0.13/-5.37.
//   blitz .68145, top-target "primary defender" .68149 (+8.53 at 2026 openers), box count no change: all stay off.
//   home field (homeF, vs his own home/away mix): worse at every size (.68126-.68150); the spread already carries it.
//   indoors (domeF): worse at every size (.68139-.68175).
//   wind (windF per mph over windAt, vs his history's wind): on all passing and receiving, mixed. On passing only (windPassOnly)
//   at 14 mph, .10: pass yds held out .6879 -> .6847 (model .6975 -> .6896), pass-yds card picks 3-1 -> 7-2 at 2026 openers,
//   whole card +18.60/+13.86/+4.01/+9.71. Box scores agree: QBs threw 88% (2024) and 85% (2025) of their usual yards in 15+ mph
//   wind; receivers showed no steady drop. LIVE since Nov 13 (the user OK'd it): nflverse records wind only after the game, so the
//   freeze uses scripts\nfl-weather.ps1's forecast. Caveats: the 14 mph threshold was picked from the same 2025 data, and no
//   held-out 2026 game has had 15+ mph wind yet, so watch passing picks in windy games. The 2026 gain is indirect: no 2026
//   projection moved; with 2025's windy games accounted for, the model fits 2025 passing yards better (.7144 -> .6992), the
//   fitted blend weight rises .3 -> .4 (now in w.PASS_YDS), and that weight tests better on 2026.
//   Forecast vs recorded wind (40 outdoor 2025 games): correlation .83; the forecast reads low, so nfl-weather.ps1 converts it.
const NOCARD=new Set(['PASS_ATT','PASS_CMP','RR_YDS','PASS_TD']);
// ---- matchup engine (play-by-play): per player-game production split by the defense's look, per defense-game the looks it
// showed. Splits: blitz (FTN: 1+ blitzers) on dropbacks; man vs zone and coverage shell (pbp participation, 2025 only:
// 2026 games use each defense's 2025 tendencies and each player's 2025 splits); box count on runs (FTN). Plus expected TDs

const COVF=c=>!c?null:/COVER_0|COVER_1|2_MAN/i.test(c)?'c01':/COVER_2/i.test(c)?'c2':/COVER_3/i.test(c)?'c3':/COVER_4|COVER_6|QUARTERS/i.test(c)?'c46':null;
const BOXB=b=>b<0?null:b<=6?'lt7':b===7?'b7':'ge8';
const YLB=y=>y<=2?0:y<=5?1:y<=10?2:y<=20?3:y<=40?4:5;
function buildMX(PL){

  for(const p of PL.plays){ if(p[I.season]!==2025) continue; const b=YLB(p[I.yl]);
    if(p[I.kind]===2&&p[I.rusher]>=0){ tdr.rn[b]++; if(p[I.td]===p[I.rusher]) tdr.r[b]++; }
    if(p[I.kind]===1&&p[I.target]>=0){ tdr.tn[b]++; if(p[I.td]===p[I.target]) tdr.t[b]++; } }
  const rateR=tdr.r.map((x,i)=>x/Math.max(1,tdr.rn[i])), rateT=tdr.t.map((x,i)=>x/Math.max(1,tdr.tn[i]));
  const team={}, player={}, def={};
  const cats=p=>({blitz:p[I.kind]===1&&p[I.blitz]>=0?(p[I.blitz]>0?'y':'n'):null, mz:p[I.kind]===1&&p[I.mz]?(p[I.mz]===1?'man':'zone'):null,
    cov:p[I.kind]===1?COVF(p[I.cov]):null, box:p[I.kind]===2?BOXB(p[I.box]):null,
    press:p[I.kind]===1&&I.press!=null?(p[I.press]?'y':'n'):null});   // pressure: sack, QB hit or scramble (Nov 12)
  const bump=(o,k,v)=>{ o[k]=(o[k]||0)+v; };
  for(const p of PL.plays){ const s=p[I.season], w=p[I.week], tk=`${s}|${w}|${p[I.off]}`, c=cats(p);
    const T=(team[tk]??={db:0,runs:0,def:p[I.def]}); const D=((def[`${p[I.def]}|${s}`]??={})[w]??={db:0,runs:0});
    if(p[I.kind]===1){ T.db++; D.db++; } else { T.runs++; D.runs++; }
    for(const t in c){ if(c[t]){ bump(T,t+':'+c[t],1); bump(D,t+':'+c[t],1); } }
    const touch=(pid,role)=>{ const g=((player[id(pid)]??={})[`${s}|${w}`]??={s,w,team:p[I.off],xtd:0}); return g; };
    if(p[I.kind]===1&&p[I.target]>=0){ const g=touch(p[I.target]); const y=p[I.cmp]?p[I.yds]:0;
      g.xtd+=rateT[YLB(p[I.yl])]; bump(g,'tgt',1); bump(g,'yds',y); for(const t of ['blitz','mz','cov','press']) if(c[t]){ bump(g,`${t}:${c[t]}:tgt`,1); bump(g,`${t}:${c[t]}:rec`,p[I.cmp]); bump(g,`${t}:${c[t]}:yds`,y); } }
    if(p[I.kind]===1&&p[I.passer]>=0){ const g=touch(p[I.passer]); const y=p[I.cmp]?p[I.yds]:0;
      for(const t of ['blitz','mz','cov','press']) if(c[t]){ bump(g,`${t}:${c[t]}:pyds`,y); bump(g,`${t}:${c[t]}:pcmp`,p[I.cmp]); } }
    if(p[I.kind]===2&&p[I.rusher]>=0){ const g=touch(p[I.rusher]); g.xtd+=rateR[YLB(p[I.yl])]; if(c.box){ bump(g,`box:${c.box}:car`,1); bump(g,`box:${c.box}:ryds`,p[I.yds]); } } }

  return {team,player,def,rateR,rateT,top};
}
function topMult(MX,pid,s,w,opp,P){
  const games=MX.player[pid]; if(!games) return 1; const ord=s*100+w; let mine=0,all=0;
  for(const k in games){ const g=games[k]; if(g.s*100+g.w>=ord||g.s<s-1) continue; const tm=MX.team[`${g.s}|${g.w}|${g.team}`]; if(!tm) continue; mine+=g.tgt||0; all+=tm.db||0; }
  if(!all||mine/all<.2) return 1;   // only for a team's main target (20%+ of dropbacks)
  const cache=(MX._c??={}); const avg=ss=>{ const key=`t|${ss}|${ss===s?w:99}`; if(key in cache) return cache[key]; let y=0,n=0; for(const k in MX.top){ if(!k.endsWith('|'+ss)) continue; for(const wk in MX.top[k]){ if(ss===s&&+wk>=w) continue; y+=MX.top[k][wk].yds; n++; } } return cache[key]=n?y/n:null; };

}
// one split's multiplier: sum over the defense's looks (shrunk to the league's) of his rate in each look (shrunk to his overall
// rate), over the same with the league's mix. num/den: his per-game measure and its denominator (team dropbacks, his carries)
function splitMult(MX,pid,s,w,opp,T,cats,num,den,P,{prevOnly=false}={}){
  const games=MX.player[pid]; if(!games) return 1; const ord=s*100+w;
  const sums={}, dens={}; let tot=0,totD=0;
  for(const k in games){ const g=games[k]; const o=g.s*100+g.w; if(o>=ord||g.s<s-1) continue; const wt=g.s<s?P.prevW:1;
    const tm=MX.team[`${g.s}|${g.w}|${g.team}`]||{};
    for(const c of cats){ const x=(g[`${T}:${c}:${num}`]||0)*wt, d=(den==='team'?(tm[`${T}:${c}`]||0):(g[`${T}:${c}:${den}`]||0))*wt; sums[c]=(sums[c]||0)+x; dens[c]=(dens[c]||0)+d; tot+=x; totD+=d; } }

  const cache=(MX._c??={});

    const n={}; let N=0; const d=MX.def[`${team}|${ss}`]||{}; for(const wk in d){ if(before&&+wk>=w) continue; for(const c of cats){ const v=d[wk][`${T}:${c}`]||0; n[c]=(n[c]||0)+v; N+=v; } }

function matchup(MX,pid,st,s,w,opp,P,recShare){
  if(!MX) return 1; let m=1; const fx=P.fx;
  const recv=(num)=>{ let x=1; if(fx.blitz) x*=splitMult(MX,pid,s,w,opp,'blitz',['y','n'],num,'team',P);
    if(fx.press) x*=splitMult(MX,pid,s,w,opp,'press',['y','n'],num,'team',P);
    if(fx.mz) x*=splitMult(MX,pid,s,w,opp,'mz',['man','zone'],num,'team',P); if(fx.cov) x*=splitMult(MX,pid,s,w,opp,'cov',['c01','c2','c3','c46'],num,'team',P); return x; };

  else if(st==='RUSH_YDS'&&fx.box) m=splitMult(MX,pid,s,w,opp,'box',['lt7','b7','ge8'],'ryds','car',P);
  else if(st==='RR_YDS'){ const mr=recv('yds')*(fx.top?topMult(MX,pid,s,w,opp,P):1), mb=fx.box?splitMult(MX,pid,s,w,opp,'box',['lt7','b7','ge8'],'ryds','car',P):1; m=recShare*mr+(1-recShare)*mb; }

// game weather for the factor tests (Nov 13): dome/closed roof = indoors, no wind; outdoors/open = the recorded wind (mph), or null
// when it wasn't recorded. nflverse records wind after the game, so a live card uses the forecast (roofFc/windFc, set by freeze
// from scripts\nfl-weather.ps1), which wins over the schedule's roof (a neutral site, a retractable roof ESPN lists as indoor).
const gameWx=g=>{ const roof=g?.roofFc??g?.roof??'', wind=g?.windFc??g?.wind??null;
  return /dome|closed/i.test(roof)?{dome:1,wind:0}:/outdoors|open/i.test(roof)?{dome:0,wind}:{dome:null,wind:null}; };
function prep(D,PL){
  const gk={};
  for(const a of D.games){ const g={}; D.gameCols.forEach((c,i)=>g[c]=a[i]); gk[`${g.season}|${g.week}|${g.home}`]=g; gk[`${g.season}|${g.week}|${g.away}`]=g; }

    const g=gk[`${r.season}|${r.week}|${r.team}`]; if(g&&g.total!=null&&g.spread!=null){ const s=g.home===r.team?1:-1; r.tt=g.total/2+s*g.spread/2; r.sp=s*g.spread; }
    if(g){ r.home=g.home===r.team?1:0; const wx=gameWx(g); r.dome=wx.dome; r.wind=wx.wind; } return r; });

  const def={}, lgSum={}, lgN={};
  for(const r of R){ const e=((def[`${r.opp}|${r.season}`]??={})[r.week]??={});
    for(const st in STATS){ const k=r.pg+'|'+st; e[k]=(e[k]||0)+(r[STATS[st]]||0); lgSum[r.season+'|'+k]=(lgSum[r.season+'|'+k]||0)+(r[STATS[st]]||0); } }
  const teamGames={}; for(const r of R){ teamGames[r.season]??=new Set(); teamGames[r.season].add(r.opp+'|'+r.week); }
  for(const s in teamGames) lgN[s]=teamGames[s].size;
  return {gk,R,byP,byName,def,lgSum,lgN,MX:PL?buildMX(PL):null};
}
function oppFactor(M,opp,s,w,pg,st,k){
  const lgAvg=(M.lgSum[(s-1)+'|'+pg+'|'+st]??M.lgSum[s+'|'+pg+'|'+st]??0)/(M.lgN[s-1]??M.lgN[s]??1); if(!(lgAvg>0)) return 1;
  const d=M.def[`${opp}|${s}`]||{}; let sum=0,n=0; for(const wk in d){ if(+wk<w){ sum+=d[wk][pg+'|'+st]||0; n++; } }
  return ((sum+k*lgAvg)/(n+k))/lgAvg;

// projected mean for a player's stat in a game; null when he has too few games
function project(M,pid,st,s,w,ctx,P){
  const all=M.byP[pid]; if(!all) return null; const f=STATS[st], ord=s*100+w;

    const bySide=pk=>Object.entries(pk.reduce((a,r)=>{(a[r.st+' '+r.side]??=[]).push(r); return a;},{})).map(([k,v])=>`${k} ${v.filter(r=>r.u>0).length}-${v.filter(r=>r.u<0).length} ${v.reduce((s,r)=>s+r.u,0).toFixed(1)}u`);
    const c26=NFL.card(r26), c25=NFL.card(r25b);
    const out={fit, test26, card25:sum(c25,'2025 card (in sample)'), card26:sum(c26,`2026 weeks 1-${test} card (held out)`), by26:bySide(c26), by25:bySide(c25), w:P2.w, atdHold:+P2.atdHold.toFixed(3)};
    if(keep){ this.r26=r26; this.r25=r25b; this.dist=dist; this.P2=P2; } return out; },
  // the week's Out/Doubtful players ("name|team"): the weekly reports (injW) plus this season's latest report
  outSet(s,w){ const o=new Set((this.D.injW||{})[`${s}|${w}`]||[]); for(const [k,v] of Object.entries(this.D.inj||{})) if(v[1]===w&&s===this.D.season&&/out|doubtful/i.test(v[0])) o.add(k); return o; },
  // simulate one week's games; returns {key "pid|stat|line" -> {pS,push}} per game plus each game's sim summary
  // today's rosters (tracking\nfl\rosters.json: nfl.com status, ESPN injuries and depth charts) -> cur(name, teams)
  // inj/week: the official NFL injury report (nflverse, data.json inj: "name|team" -> [game status, week]). When a player is on
  // this week's report, it beats ESPN's roster tag: Out/Doubtful = out, Questionable or no designation = active. ESPN's "Out"
  // can lag a week (Skattebo and Burks, Nov 12: ESPN Out, official report no designation, both played).
  curFn(RO,{inj=null,week=null}={}){ if(!RO?.teams) return null; const by={}, OFF=/^(QB|RB|FB|WR|TE)$/;
    const off={}; if(inj&&week) for(const [k,v] of Object.entries(inj)){ if(v[1]!==week) continue; const i=k.lastIndexOf('|'); off[NFL.norm(k.slice(0,i))+'|'+k.slice(i+1)]=v[0]||''; }
    for(const [team,T] of Object.entries(RO.teams)){ const role={};
      for(const [slot,arr] of Object.entries(T.depth||{})) (arr||[]).forEach((a,i)=>{ const k=NFL.norm(a.name); if(role[k]) return; role[k]=slot.startsWith('wr')?(i===0?'WR'+slot.slice(2):'WR backup'):slot.toUpperCase()+(i+1); });
      const nfl={}; for(const p of T.nfl||[]) nfl[NFL.norm(p.name)]=p;
      const seen=new Set();
      for(const p of [...(T.espn||[]),...(T.nfl||[])]){ const k=NFL.norm(p.name); if(seen.has(k)) continue; seen.add(k); const n=nfl[k], e=(T.espn||[]).find(x=>NFL.norm(x.name)===k);
        if(!OFF.test(n?.pos||e?.pos||'')) continue;
        let ok=true, why='';
        if(n&&n.status!=='ACT'){ ok=false; why=`${n.status==='RES'?'reserve/IR':n.status} (nfl.com)`; }
        else if(!n&&e&&!/offense|defense|specialTeam/.test(e.group)){ ok=false; why=e.group==='practiceSquad'?'practice squad':'IR/out (ESPN)'; }
        if(ok&&e?.inj&&/out|doubtful|injured reserve/i.test(e.inj)){ ok=false; why=`${e.inj} (ESPN)`; }
        const rep=off[k+'|'+team]; let report=null;
        if(rep!=null&&!(n&&n.status!=='ACT')){ report=rep||'no designation'; if(/out|doubtful/i.test(rep)){ ok=false; why=`${rep} (injury report)`; } else if(!ok&&/ESPN/.test(why)){ ok=true; why=''; } }
        (by[k]??=[]).push({team, ok, why, role:role[k]||null, report}); } }
    return (name,teams=[])=>{ const a=by[NFL.norm(name)]; if(!a) return null; return a.find(x=>teams.includes(x.team))||a[0]; }; },
  simWeek(L,SP,{nS=SP.nSims,keepScripts=false,cur=null}={}){ const M=this.M, s=L.season, w=L.week, out=this.outSet(s,w), res={}, scr=[];
    for(const G of L.games){ const gm=M.gk[`${s}|${w}|${G.home}`]; if(!gm||gm.spread==null||gm.total==null) continue;
      const pids={}, core=new Set(); for(const q of G.props){ const k=q.player; if(!(k in pids)) pids[k]=NFL.findPid(M,q.player,[G.away,G.home],s,w); if(q.stat!=='ATD'&&pids[k]) core.add(pids[k]); }   // core: players with a yardage/catch prop (the TD market lists nearly everyone)
      const sim=NFLSIM.simGame(M,{home:G.home,away:G.away,spread:gm.spread,total:gm.total,s,w},SP,{props:core,out,cur,nS,seedBase:s*1000+w*31+G.home.charCodeAt(0)});
      if(!sim) continue; if(keepScripts) scr.push({game:`${G.away} @ ${G.home}`, start:G.start, ...NFLSIM.scripts(sim)});
      for(const q of G.props){ const pid=pids[q.player]; if(!pid) continue; const k=`${s}|${w}|${pid}|${q.stat}|${q.line}`; if(k in res) continue;
        const v=NFLSIM.values(sim,pid,q.stat); if(!v) continue; let m=0; for(const x of v) m+=x; res[k]={...NFLSIM.pLine(v,q.line), mean:m/v.length}; } }
    return {res,scr}; },
  // sim backtest: pSim for every priced prop (both seasons), joined to the current model's rows for each book
  simBT({nS=3000,SP=null,books=['OPEN','FAN'],test=9}={}){ const M=this.M; SP=SP||NFLSIM.fit(M,[2025]); this.SP=SP; const sims={};
    for(const L of this.WK){ if(L.season===2026&&L.week>test) continue; Object.assign(sims,this.simWeek(L,SP,{nS}).res); }
    const rows={}; for(const b of books){ this.EV(NFL.P0,{test,keep:true,book:b}); rows[b]=[...this.r25,...this.r26].map(r=>{ const x=sims[`${r.s}|${r.w}|${r.pid}|${r.st}|${r.line}`];
        if(!x) return {...r}; const pSim=r.side==='Over'?x.pS:Math.max(0,1-x.pS-x.push); return {...r, pSim:pSim/Math.max(1e-9,1-x.push), simMean:x.mean}; }); }
    this.simRows=rows; return {n:Object.keys(sims).length, rows:Object.fromEntries(books.map(b=>[b,rows[b].length]))}; },
  // the week's paper card: priced at the earliest line we have for each prop (the opener; Fanatics once it's the only one),
  // distribution trained on every graded prop so far; players listed Out/Doubtful on this week's injury report are left out
  async freeze(season,week,{books=['OPEN','FAN'],nS=10000}={}){ const M=this.M;
    const L=await fetch(`/nfl/lines-${season}-w${String(week).padStart(2,'0')}.json`,{cache:'no-store'}).then(r=>r.json());
    // game-time wind forecast (scripts\nfl-weather.ps1; run it first, and again on game day): passing projections drop past
    // P0.windAt mph. Without the file, outdoor games have no wind and get no adjustment.
    const WX=await fetch(`/nfl/weather-${season}-w${String(week).padStart(2,'0')}.json`,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null), wxBy={};
    for(const x of WX?.games||[]){ wxBy[x.game]=x; const gm=M.gk[`${season}|${week}|${x.game.split(' @ ')[1]}`]; if(!gm) continue;
      gm.roofFc=x.indoor?'dome':'outdoors'; gm.windFc=x.indoor?0:x.wind??null; }
    const train=this.WK.filter(x=>x.season<season||(x.season===season&&x.week<week)); const dist=NFL.makeDist(NFL.trainRows(M,train,NFL.P0));
    const inj=this.D.inj||{}, have=new Set(), rows=[];
    const RO=await fetch('/nfl/rosters.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null), cur=this.curFn(RO,season===this.D.season?{inj:this.D.inj,week}:{});
    for(const b of books){ const add=NFL.priceWeek(M,L,dist,NFL.P0,{book:b,grade:false,cur}).filter(r=>!have.has(`${r.pid}|${r.st}`));
      for(const r of add){ const ij=inj[`${r.player}|${r.team}`]; if(ij&&ij[1]===week&&!r.out){ r.inj=ij[0]; if(/out|doubtful/i.test(ij[0])) r.out=true; }
        r.book=b; rows.push(r); }
      for(const r of add) have.add(`${r.pid}|${r.st}`); }
    // every game simulated nS times: each prop's sim chance and average, the sim blended in where it backtested better
    // (P0.simW: rushing and anytime TD), and each game's script groups
    // ESPN "Out" while DK/FD/Fanatics still price his yardage props (books pull props once a player is ruled out): his own props
    // stay off the card, but the sims keep his share rather than handing it to teammates on news the market doesn't believe yet
    const live=new Set(L.games.flatMap(g=>g.props.filter(q=>q.book!=='OPEN'&&q.stat!=='ATD').map(q=>NFL.norm(q.player))));
    const curSim=cur&&((n,t)=>{ const x=cur(n,t); return x&&!x.ok&&/ESPN/.test(x.why)&&live.has(NFL.norm(n))?{...x,ok:true}:x; });
    for(const r of rows) if(r.out&&/ESPN/.test(r.inj||'')&&live.has(NFL.norm(r.player))) r.inj+=', books still pricing him';
    const SP=this.SP||(this.SP=NFLSIM.fit(M,[season-1])); const {res,scr}=this.simWeek(L,SP,{nS,keepScripts:true,cur:curSim});
    for(const r of rows){ const x=res[`${season}|${week}|${r.pid}|${r.st}|${r.line}`]; if(!x) continue;
      const ps=r.side==='Over'?x.pS:Math.max(0,1-x.pS-x.push); r.pSim=ps/Math.max(1e-9,1-x.push); r.simMean=x.mean;
      const W=NFL.P0.simW[r.st]; if(W){ r.pPre=r.p; r.p=NFL.sg((1-W[0]-W[1])*NFL.lg(r.pm)+W[0]*NFL.lg(r.pS)+W[1]*NFL.lg(r.pSim)); r.ev=r.p*(NFL.dec(r.odds)-1)-(1-r.p); } }
    // snap share on every row; a Fanatics-only freeze is a game-day card, where long shots need GAMEDAY_SNAP.
    // Before locking a game-day card, check the official inactives (out about 90 minutes before kickoff) and re-freeze if a
    // carded player is inactive: a healthy scratch still shows as active on the nfl.com/ESPN rosters (Van Jefferson, Nov 12).
    for(const r of rows){ r.snap3=NFL.snap3(M,r.pid,season,week); const x=wxBy[r.game]; if(x&&!x.indoor&&x.wind!=null) r.wind=x.wind; }
    const gameday=books.length===1&&books[0]==='FAN';
    const picks=NFL.card(rows,gameday?{long:{...NFL.LONG,minSnap:NFL.GAMEDAY_SNAP}}:{}).map(r=>({...r, stake:r.tier==='long'?NFL.LONG.stake:NFL.stake(r.p)}));
    const board=rows.filter(r=>!NFL.NOCARD.has(r.st)).sort((a,b)=>b.ev-a.ev).slice(0,250);
    const games=L.games.map(g=>({game:`${g.away} @ ${g.home}`, start:g.start, open:g.props.filter(q=>q.book==='OPEN').length, fan:g.props.filter(q=>q.book==='FAN').length}));
    return {season, week, frozenAt:new Date().toISOString(), linesFetched:L.fetched, rostersFetched:RO?.fetched||null, weatherFetched:WX?.fetched||null, nSims:nS, picks, board, games, sims:scr}; }
};

// ===================== page: the frozen paper card and the backtest summary =====================
(async()=>{
  if(new URLSearchParams(location.search).has('norun')) return;
  const app=document.getElementById('app'), j=u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  const [c,bt]=await Promise.all([j('card.json'),j('backtest.json')]);
  const odds=o=>o>0?'+'+o:''+o, pct=x=>(100*x).toFixed(1)+'%', when=t=>new Date(t).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'});
  let h='';
  h+=`<div class="card banner"><b>Pilot, no real stakes.</b> <span class="mut">Picks are tracked on paper until the model has earned trust over several weeks. Card rules match the NBA card: price −150 to +150, 60%+ win chance, 5%+ expected profit, two picks a game, one per player. Plus long shots priced +151 to +250 with a 5%+ edge, at 0.5u, up to three picks a game.</span></div>`;
  if(c){
    h+=`<div class="card"><h2>${c.season} week ${c.week} paper card</h2><div class="mut">Frozen ${new Date(c.frozenAt).toLocaleString()} · ${c.picks.length} picks${c.note?' · '+c.note:''}</div>`;
    if(c.picks.length){ h+=`<table><tr><th>Game</th><th>Pick</th><th class="n">Price</th><th class="n">Win</th><th class="n hide-s">Proj</th><th class="n">Stake</th><th class="n">Result</th></tr>`;
      for(const p of c.picks){ const res=p.u==null?'<span class="mut">'+when(p.start)+'</span>':p.u>0?`<span class="W">W ${p.actual}</span>`:p.u<0?`<span class="L">L ${p.actual}</span>`:`push`;
        h+=`<tr><td>${p.game}</td><td>${p.player} ${p.side.toLowerCase()} ${p.line} ${NFL.LABEL[p.st]}</td><td class="n">${odds(p.odds)}</td><td class="n">${pct(p.p)}</td><td class="n hide-s">${p.proj.toFixed(1)}</td><td class="n">${p.stake}u</td><td class="n">${res}</td></tr>`; }
      h+=`</table>`; } else h+=`<p class="mut">No prop cleared the bar.</p>`;
    h+=`</div>`;
    const near=(c.board||[]).filter(r=>!c.picks.some(p=>p.pid===r.pid&&p.st===r.st)).slice(0,8);
    if(near.length){ h+=`<div class="card"><h2>Closest to the bar</h2><div class="mut">Best expected profit among props that didn't make the card.</div><table><tr><th>Game</th><th>Prop</th><th class="n">Price</th><th class="n">Win</th><th class="n">Edge</th></tr>`;
      for(const r of near) h+=`<tr><td>${r.game}</td><td>${r.player} ${r.side.toLowerCase()} ${r.line} ${NFL.LABEL[r.st]} <span class="chip">${r.book==='OPEN'?'opener':'Fanatics'}</span></td><td class="n">${odds(r.odds)}</td><td class="n">${pct(r.p)}</td><td class="n">${pct(r.ev)}</td></tr>`;
      h+=`</table></div>`; }
  }
  if(bt){
    h+=`<div class="card"><h2>Backtest</h2><div class="mut">${bt.note||''}</div><table><tr><th>Set</th><th class="n">Record</th><th class="n">Flat</th><th class="n">Staked</th><th class="n">Return</th></tr>`;
    for(const r of bt.rows) h+=`<tr><td>${r.name}</td><td class="n">${r.w}-${r.l}</td><td class="n">${r.flat.toFixed(2)}u</td><td class="n">${r.staked.toFixed(2)}u</td><td class="n">${pct(r.roi)}</td></tr>`;
    h+=`</table>`; if(bt.markets){ h+=`<table style="margin-top:10px"><tr><th>Market (2026, held out)</th><th class="n">Props</th><th class="n">Log loss market</th><th class="n">Model+market</th><th class="n">Sim weight</th></tr>`;
      for(const m of bt.markets) h+=`<tr><td>${NFL.LABEL[m.st]}</td><td class="n">${m.n}</td><td class="n">${m.llM.toFixed(4)}</td><td class="n">${m.llB.toFixed(4)}</td><td class="n">${m.w.toFixed(2)}</td></tr>`; h+=`</table>`; }
    h+=`</div>`;
  }
  app.innerHTML=h||'<div class="card">No card yet.</div>';
})();
